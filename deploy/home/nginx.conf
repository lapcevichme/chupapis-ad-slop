# AdPilot on the home server: the frontend container is the only public entry (Coolify/Traefik terminate TLS).
# Baked into the image by deploy/home/frontend.Dockerfile. /api/* goes to the backend with the prefix stripped
# (the same rewrite the Vite dev proxy does).
server {
    listen 80;
    root /usr/share/nginx/html;
    # Photos (5 MB each) and dictated audio; the backend enforces the real limits.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Traefik sets X-Real-Ip to the TCP peer and drops client-supplied values: use it as the one client IP,
        # not the spoofable X-Forwarded-For chain. The backend rate-limits logins by this address.
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        # Chat answers stream over SSE, and the agent can think for a while.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
