name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check app tests alembic
      - run: uv run ruff format --check app tests alembic
      - run: uv run mypy app
      - run: uv run pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Деплой только из main и только после зелёных тестов. Бэкенд раньше фронта: фронт может зависеть от нового API.
  # Если секретов нет (форк, секреты ещё не заведены), шаги деплоя пропускаются с предупреждением, а не валят main.
  deploy-backend:
    needs: [changes, test-backend, test-frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Один деплой за раз: у бэкенда одна машина с SQLite на томе.
    concurrency: deploy-backend
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Секрет FLY_API_TOKEN не задан
        if: env.FLY_API_TOKEN == ''
        run: echo "::warning::FLY_API_TOKEN не задан, деплой бэкенда пропущен"
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Деплой на Fly.io
        if: env.FLY_API_TOKEN != ''
        working-directory: backend
        run: flyctl deploy --remote-only --ha=false

  deploy-frontend:
    needs: [changes, test-backend, test-frontend, deploy-backend]
    # deploy-backend может быть пропущен (бэкенд не менялся), но не упасть.
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.frontend == 'true'
      && needs.test-backend.result == 'success' && needs.test-frontend.result == 'success'
      && needs.deploy-backend.result != 'failure' && needs.deploy-backend.result != 'cancelled'
    runs-on: ubuntu-latest
    concurrency: deploy-frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Секреты Vercel не заданы
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID или VERCEL_PROJECT_ID не заданы, деплой фронта пропущен"
        working-directory: .
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        with:
          node-version: 24
      - name: Деплой на Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          npm install --global vercel@53.2.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
